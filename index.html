<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* ============================================================
   بنون — لوحة الألوان.  الذهبي مأخوذ حرفيًا من الشعار: #D6BAA8
   ============================================================ */
:root{
  --brand:#2E1A46;
  --brand-2:#3F2A5C;

  /* الذهبي ودرجاته — الأساس #D6BAA8 هو لون الشعار نفسه */
  --gold:#D6BAA8;
  --gold-hi:#F4E6DA;
  --gold-soft:#E4CDBC;
  --gold-deep:#B08A72;
  --gold-dark:#8B6A54;
  --gold-sheen:linear-gradient(135deg,#F4E6DA 0%,#D6BAA8 34%,#B08A72 58%,#EBD8C8 82%,#C9A48D 100%);
  --gold-line:linear-gradient(90deg,transparent,#D6BAA8,transparent);

  /* أسماء متوافقة مع النسخة السابقة */
  --sand:var(--gold);
  --sand-deep:var(--gold-deep);
  --accent:var(--gold-deep);

  --ground:#FBF7F4;
  --surface:#FFFFFF;
  --surface-2:#F6EFE9;
  --panel:#2E1A46;
  --panel-text:#F6EFE9;
  --heading:#2A1733;
  --text:#4A3D55;
  --muted:#7A6A88;
  --line:#EADFD5;
  --line-strong:#DCCBBE;
  --shadow:0 1px 2px rgba(46,26,70,.05), 0 12px 32px -18px rgba(46,26,70,.28);
  --shadow-lg:0 2px 4px rgba(46,26,70,.06), 0 30px 60px -30px rgba(46,26,70,.4);
  --glow:0 18px 50px -24px rgba(176,138,114,.75);
  --logo-dark:block; --logo-light:none;
  --r:14px;
  --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#150D20;
    --surface:#1E1430;
    --surface-2:#241635;
    --panel:#1B1029;
    --panel-text:#F2EAE4;
    --heading:#F4EDE7;
    --text:#C8BBD3;
    --muted:#9A8AAA;
    --line:#2F2043;
    --line-strong:#3C2A54;
    --accent:#D6BAA8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 34px 70px -34px rgba(0,0,0,.85);
    --glow:0 18px 54px -22px rgba(214,186,168,.45);
    --logo-dark:none; --logo-light:block;
  }
}
:root[data-theme="dark"]{
  --ground:#150D20;
  --surface:#1E1430;
  --surface-2:#241635;
  --panel:#1B1029;
  --panel-text:#F2EAE4;
  --heading:#F4EDE7;
  --text:#C8BBD3;
  --muted:#9A8AAA;
  --line:#2F2043;
  --line-strong:#3C2A54;
  --accent:#D6BAA8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 34px 70px -34px rgba(0,0,0,.85);
  --glow:0 18px 54px -22px rgba(214,186,168,.45);
  --logo-dark:none; --logo-light:block;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--text);
  font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:clamp(15px,.55vw + 13.5px,17px);
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[dir="ltr"] body{line-height:1.7}
h1,h2,h3,.display{
  font-family:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  color:var(--heading);font-weight:400;line-height:1.35;text-wrap:balance;margin:0;
}
html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3{line-height:1.2}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;border-radius:4px}
.wrap{width:min(1180px,100%);margin-inline:auto;padding-inline:20px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

.eyebrow{
  font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);font-weight:600;margin:0;
}
html[dir="rtl"] .eyebrow{letter-spacing:.06em;font-size:.8rem}
.goldtext{
  background:var(--gold-sheen);-webkit-background-clip:text;background-clip:text;
  color:transparent;font-weight:500;
}

/* ---------- header ---------- */
header.site{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  background:color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter:saturate(1.5) blur(14px);
  border-block-end:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:18px;min-height:72px}
.brandlink{display:flex;align-items:center;text-decoration:none;flex:0 0 auto}
.brandlink img{height:36px;width:auto}
.brandlink .l-dark{display:var(--logo-dark)}
.brandlink .l-light{display:var(--logo-light)}
nav.main{display:flex;gap:28px;margin-inline-start:32px;font-size:.92rem}
nav.main a{text-decoration:none;color:var(--text);padding-block:6px;position:relative}
nav.main a::after{
  content:"";position:absolute;inset-inline:0;bottom:0;height:2px;border-radius:2px;
  background:var(--gold-sheen);
  transform:scaleX(0);transform-origin:var(--ts,right);transition:transform .35s cubic-bezier(.2,.7,.2,1);
}
html[dir="ltr"] nav.main a{--ts:left}
nav.main a:hover::after,nav.main a:focus-visible::after{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
nav.main + .tools{margin-inline-start:auto}
.ghost{
  font:inherit;font-size:.82rem;letter-spacing:.06em;
  background:none;border:1px solid var(--line-strong);color:var(--text);
  padding:8px 14px;border-radius:999px;cursor:pointer;line-height:1.4;
  transition:border-color .25s,color .25s,background .25s;
}
.ghost:hover{border-color:var(--gold-deep);color:var(--heading);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.menubtn{display:none}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  padding:14px 28px;border-radius:999px;font-size:.95rem;font-weight:500;
  border:1px solid transparent;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,background .25s,color .25s,border-color .25s;
}
.btn:hover{transform:translateY(-3px)}
.btn-gold{
  background:var(--gold-sheen);color:#33203F;font-weight:600;
  box-shadow:0 10px 26px -14px rgba(176,138,114,.95), inset 0 1px 0 rgba(255,255,255,.55);
}
.btn-gold:hover{box-shadow:0 18px 38px -16px rgba(176,138,114,1), inset 0 1px 0 rgba(255,255,255,.7)}
.btn-gold::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .8s ease;
}
.btn-gold:hover::after{transform:translateX(120%)}
.btn-line{border-color:rgba(214,186,168,.5);color:var(--panel-text)}
.btn-line:hover{border-color:var(--gold);background:rgba(214,186,168,.12)}
.btn-ink{background:var(--brand);color:#F6EFE9;box-shadow:0 12px 28px -18px rgba(46,26,70,.9)}
:root[data-theme="dark"] .btn-ink{background:var(--gold-sheen);color:#2E1A46}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-ink{background:var(--gold-sheen);color:#2E1A46}}

/* ---------- 3D helpers ---------- */
.stage{perspective:1400px;perspective-origin:50% 45%}
.tilt{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.float{animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
@keyframes floatSlow{0%,100%{transform:translateY(8px) rotate(2deg)}50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .float,.orb,.spark{animation:none!important}
  .btn:hover{transform:none}
}
.orb{position:absolute;pointer-events:none;filter:drop-shadow(0 22px 34px rgba(46,26,70,.28))}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{
  background:
    radial-gradient(120% 95% at 100% 0%, rgba(214,186,168,.22), transparent 58%),
    radial-gradient(90% 85% at 0% 100%, rgba(214,186,168,.10), transparent 62%),
    linear-gradient(160deg,var(--panel) 0%, #3A2356 55%, #2A1740 100%);
  color:var(--panel-text);position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset-inline:0;bottom:0;height:140px;pointer-events:none;
  background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--ground) 85%,transparent));
}
.hero .wrap{
  position:relative;z-index:2;display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  gap:40px;align-items:center;padding-block:clamp(48px,6.5vw,96px);
}
.hero h1{
  color:var(--panel-text);font-weight:300;
  font-size:clamp(2.05rem,4.4vw,3.55rem);
  margin-block:18px 20px;letter-spacing:-.01em;
}
.hero h1 em{
  font-style:normal;font-weight:500;
  background:var(--gold-sheen);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lead{color:rgba(246,239,233,.78);max-width:54ch;font-size:1.06rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-block-start:34px}
.hero .meta{
  display:flex;flex-wrap:wrap;gap:10px 26px;margin-block-start:38px;
  padding-block-start:22px;border-block-start:1px solid rgba(214,186,168,.24);
  font-size:.84rem;color:rgba(246,239,233,.64);
}
.hero .meta span{display:flex;align-items:center;gap:9px}
.hero .meta span::before{
  content:"";width:7px;height:7px;background:var(--gold-sheen);transform:rotate(45deg);
  box-shadow:0 0 12px rgba(214,186,168,.7);
}
.heroart{position:relative;justify-self:center;width:min(460px,100%);aspect-ratio:1/.92}
.heroart svg.scene{width:100%;height:100%;overflow:visible}
.heroart #heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 40px rgba(14,7,24,.55))}

/* ---------- حركة الواجهة ---------- */
.heroart .hLogo{transform-box:view-box;transform-origin:220px 140px;animation:hFloat 7.5s ease-in-out infinite}
@keyframes hFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.heroart .hGlowE{transform-box:view-box;transform-origin:220px 140px;animation:hPulse 7.5s ease-in-out infinite}
@keyframes hPulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.heroart .hBits rect{animation:hTwinkle 6s ease-in-out infinite}
.heroart .hBits rect:nth-child(2){animation-delay:1.4s}
.heroart .hBits rect:nth-child(3){animation-delay:2.6s}
.heroart .hBits rect:nth-child(4){animation-delay:3.8s}
@keyframes hTwinkle{0%,100%{opacity:.35}50%{opacity:1}}
.heroart .hB1{animation:hTwinkle 9s ease-in-out infinite}
.heroart .hB2{animation:hTwinkle 11s ease-in-out infinite reverse}
.heroart .hSheen{position:absolute;left:19.5%;top:22.5%;width:60.9%;height:25.3%;pointer-events:none;
  -webkit-mask-image:var(--lg);mask-image:var(--lg);-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.42) 50%,transparent 60%);
  background-size:300% 100%;mix-blend-mode:screen;animation:hSheenMove 7.5s ease-in-out infinite;animation-delay:1s}
@keyframes hSheenMove{0%{background-position:180% 0}55%,100%{background-position:-80% 0}}
@media (prefers-reduced-motion: reduce){
  .heroart .hLogo,.heroart .hGlowE,.heroart .hBits rect,.heroart .hB1,.heroart .hB2,.heroart .hSheen{animation:none!important}
}

.heroart .glowbed{
  position:absolute;inset:8% 6% 14%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(214,186,168,.34),transparent 72%);
  filter:blur(6px);
}
.heroart .ring{
  position:absolute;inset:-4%;border:1px solid rgba(214,186,168,.18);border-radius:50%;
  animation:spin 46s linear infinite;
}
.heroart .ring::before{
  content:"";position:absolute;top:calc(50% - 5px);inset-inline-start:-5px;width:10px;height:10px;
  background:var(--gold);transform:rotate(45deg);box-shadow:0 0 16px rgba(214,186,168,.9);
}

/* ---------- gold band ---------- */
.band{height:16px;background-repeat:repeat-x;background-size:auto 16px;background-color:#241635}

/* ---------- stats ---------- */
.stats{
  position:relative;z-index:3;margin-block-start:-46px;
}
.stats .grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.stats .cell{background:var(--surface);padding:26px 22px;text-align:center;position:relative}
.stats .cell::before{
  content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--gold-sheen);
  transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
.stats .cell:hover::before{transform:scaleX(1)}
.stats .n{
  font-family:"Readex Pro",sans-serif;font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:600;line-height:1.1;
  background:var(--gold-sheen);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 1px rgba(139,106,84,.25));
}
.stats .t{font-size:.86rem;color:var(--muted);margin-block-start:6px}

/* ---------- sections ---------- */
section{padding-block:clamp(58px,6.5vw,96px)}
.sechead{display:flex;align-items:baseline;gap:16px;margin-block-end:38px}
.sechead h2{font-size:clamp(1.55rem,2.8vw,2.3rem);font-weight:400}
.sechead .rule{flex:1;height:1px;background:var(--gold-line);min-width:20px;opacity:.7}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr);gap:clamp(32px,5vw,68px);align-items:start}
.about p + p{margin-block-start:18px}
.quote{
  position:relative;padding-inline-start:24px;
  font-family:"Readex Pro",sans-serif;font-weight:300;font-size:1.14rem;
  color:var(--heading);line-height:1.75;
}
.quote::before{
  content:"";position:absolute;inset-block:2px;inset-inline-start:0;width:3px;border-radius:3px;
  background:var(--gold-sheen);
}
.values{display:grid;gap:14px}
.valcard{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;display:flex;gap:16px;align-items:flex-start;
  box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .3s;
  transform-style:preserve-3d;
}
.valcard:hover{transform:translateY(-6px) rotateX(5deg) rotateY(-4deg);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.valcard h3{font-size:1.02rem;font-weight:500;margin-block-end:4px}
.valcard p{font-size:.9rem;color:var(--muted);line-height:1.7}
.ico3d{flex:0 0 auto;width:52px;height:52px}
.ico3d svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 12px rgba(139,106,84,.3))}

/* ---------- services ---------- */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:18px}
.svc-card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:30px 26px 28px;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .35s;
  transform-style:preserve-3d;
}
.svc-card::before{
  content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--gold-sheen);
  transform:scaleX(0);transform-origin:var(--ts,right);transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
html[dir="ltr"] .svc-card{--ts:left}
.svc-card::after{
  content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(214,186,168,.22),transparent 70%);
  opacity:0;transition:opacity .5s;
}
.svc-card:hover{transform:translateY(-8px) rotateX(6deg);box-shadow:var(--shadow-lg),var(--glow);border-color:var(--gold)}
.svc-card:hover::before{transform:scaleX(1)}
.svc-card:hover::after{opacity:1}
.svc-card .ico3d{width:74px;height:74px;margin-block-end:18px}
.svc-card h3{font-size:1.1rem;font-weight:500;margin-block-end:8px;position:relative}
.svc-card p{color:var(--muted);font-size:.93rem;position:relative}

/* ---------- process ---------- */
.proc{background:var(--surface-2);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:26px;position:relative}
.step{position:relative;text-align:center;padding-inline:8px}
.step .cube{width:84px;height:84px;margin:0 auto 16px}
.step .cube svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 18px rgba(139,106,84,.35));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.step:hover .cube svg{transform:translateY(-8px) scale(1.06)}
.step h3{font-size:1.04rem;font-weight:500;margin-block-end:6px}
.step p{font-size:.9rem;color:var(--muted)}
.steps::before{
  content:"";position:absolute;top:42px;inset-inline:12%;height:1px;
  background:var(--gold-line);opacity:.55;z-index:0;
}
@media (max-width:760px){.steps::before{display:none}}

/* ---------- why ---------- */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.why article{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:28px 24px 30px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);
  transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .3s;
}
.why article:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.why .num{
  display:inline-flex;align-items:center;gap:9px;
  font-family:"Readex Pro",sans-serif;font-size:.78rem;letter-spacing:.14em;
  color:var(--gold-deep);font-weight:600;
}
.why .num::before{content:"";width:8px;height:8px;background:var(--gold-sheen);transform:rotate(45deg)}
.why h3{font-size:1.06rem;font-weight:500}
.why p{font-size:.92rem;color:var(--muted)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:16px}
.branches article{
  position:relative;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 24px 28px;box-shadow:var(--shadow);
  transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .3s;
}
.branches article:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.branches h3{font-size:1.06rem;font-weight:500;margin:0}
.branches .city{
  display:inline-flex;align-items:center;gap:9px;margin:6px 0 14px;
  font-family:"Readex Pro",sans-serif;font-size:.78rem;letter-spacing:.14em;
  color:var(--gold-deep);font-weight:600;
}
.branches .city::before{content:"";width:8px;height:8px;background:var(--gold-sheen);transform:rotate(45deg)}
.branches .row{display:flex;gap:10px;font-size:.9rem;color:var(--muted);margin-block-start:7px;line-height:1.7}
.branches .row b{font-weight:500;color:var(--text);min-width:62px;flex:none}
.branches .row a{color:var(--muted);text-decoration:none}
.branches .row a:hover{color:var(--gold-deep)}
.branches .maplink{display:inline-block;margin-block-start:15px;font-size:.88rem;color:var(--gold-deep);text-decoration:none;font-weight:500}
.branches .maplink:hover{text-decoration:underline}

/* ---------- الأخبار ---------- */
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.news article{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 24px;box-shadow:var(--shadow);overflow:hidden;
  transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .3s;
}
.news article:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.news .thumb{margin:-26px -24px 18px;aspect-ratio:16/9;overflow:hidden;background:var(--surface-2)}
.news .thumb img{width:100%;height:100%;object-fit:cover}
.news .date{
  display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:var(--gold-deep);font-weight:600;
  margin-block-end:8px;
}
.news .date::before{content:"";width:7px;height:7px;background:var(--gold-sheen);transform:rotate(45deg)}
.news h3{font-size:1.06rem;font-weight:500;margin-block-end:8px}
.news p{font-size:.93rem;color:var(--muted)}
.news details{margin-block-start:12px}
.news details > summary{
  cursor:pointer;list-style:none;font-size:.86rem;color:var(--gold-deep);font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.news details > summary::-webkit-details-marker{display:none}
.news details > summary::after{content:"↓";font-size:.9em;transition:transform .3s}
.news details[open] > summary::after{transform:rotate(180deg)}
.news details .body{margin-block-start:10px;font-size:.92rem;color:var(--text);white-space:pre-line}
.empty{color:var(--muted);font-size:.92rem}

/* ---------- CTA ---------- */
.cta-band{position:relative;overflow:hidden;background:linear-gradient(140deg,#2E1A46,#4A2F6B 60%,#2A1740)}
.cta-band .wrap{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.2fr) auto;gap:32px;align-items:center;padding-block:clamp(42px,5vw,64px)}
.cta-band h2{color:#F6EFE9;font-weight:300;font-size:clamp(1.5rem,3vw,2.2rem)}
.cta-band h2 em{font-style:normal;background:var(--gold-sheen);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500}
.cta-band p{color:rgba(246,239,233,.72);margin-block-start:10px}
.cta-deco{position:absolute;inset-block:0;inset-inline-end:-120px;width:340px;opacity:.26;pointer-events:none;filter:blur(.2px)}
.cta-deco svg{width:100%;height:100%;overflow:visible}

/* ---------- contact ---------- */
.contact{background:var(--surface);border-block:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(32px,5vw,60px);align-items:start}
.detail{display:flex;gap:14px;padding-block:16px;border-block-end:1px solid var(--line)}
.detail:last-of-type{border-block-end:0}
.detail .k{font-size:.82rem;color:var(--gold-deep);font-weight:600;min-width:78px;padding-block-start:2px}
html[dir="ltr"] .detail .k{letter-spacing:.12em;text-transform:uppercase;font-size:.74rem}
.detail .v{color:var(--heading)}
.detail a{text-decoration:none;border-block-end:1px solid var(--line-strong);padding-block-end:2px}
.detail a:hover{border-color:var(--gold-deep)}
form{display:grid;gap:16px;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:7px;font-size:.84rem;color:var(--muted)}
input,textarea,select{
  font:inherit;font-size:.95rem;color:var(--heading);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:12px 14px;width:100%;
  transition:border-color .25s,box-shadow .25s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
textarea{min-height:120px;resize:vertical}
.formnote{font-size:.8rem;color:var(--muted)}
.fstatus{font-size:.88rem;margin:10px 0 0;min-height:1.2em}
.fstatus.ok{color:var(--gold-deep)}
.fstatus.err{color:#C0563F}

/* ---------- footer ---------- */
footer.site{background:var(--panel);color:rgba(246,239,233,.72);padding-block:46px;position:relative;overflow:hidden}
footer.site::before{
  content:"";position:absolute;inset-inline:0;top:0;height:2px;background:var(--gold-line);opacity:.6;
}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;position:relative}
footer.site img{height:42px;width:auto}
.social{display:flex;gap:10px}
.social a{
  width:40px;height:40px;display:grid;place-items:center;
  border:1px solid rgba(214,186,168,.32);border-radius:50%;color:var(--gold);
  text-decoration:none;transition:background .25s,border-color .25s,transform .3s;
}
.social a:hover{background:rgba(214,186,168,.16);border-color:var(--gold);transform:translateY(-3px)}
.social svg{width:17px;height:17px;fill:currentColor}
.copy{font-size:.82rem;width:100%;padding-block-start:22px;border-block-start:1px solid rgba(214,186,168,.18);color:rgba(246,239,233,.5)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;gap:30px}
  .heroart{order:-1;width:min(360px,78%);justify-self:start}
  .about,.cgrid{grid-template-columns:1fr}
  .stats .grid{grid-template-columns:repeat(2,1fr)}
  .cta-band .wrap{grid-template-columns:1fr}
  .cta-deco{display:none}
}
@media (max-width:760px){
  nav.main{
    display:none;position:absolute;inset-inline:0;top:100%;flex-direction:column;gap:0;
    background:var(--surface);border-block-end:1px solid var(--line);padding:6px 20px 14px;
  }
  nav.main.open{display:flex}
  nav.main a{padding-block:12px;border-block-end:1px solid var(--line)}
  .menubtn{display:inline-flex}
  .tools{margin-inline-start:auto}
  .frow{grid-template-columns:1fr}
  .hero .meta{gap:6px 18px;font-size:.78rem}
  .stats{margin-block-start:-30px}
  form{padding:20px}
}

/* ---------- حركة المجسّمات ---------- */
.hfloat{animation:float 7.5s ease-in-out infinite;transform-origin:220px 108px}
.hfloat2{animation:floatSlow 9s ease-in-out infinite}
.hfloat3{animation:floatSlow 11s ease-in-out infinite reverse}
@media (prefers-reduced-motion:reduce){.hfloat,.hfloat2,.hfloat3{animation:none}}
</style>
</head>
<body>

<!-- ======== تعريفات التدرّج الذهبي المستخدمة في كل المجسّمات ======== -->

  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EBE1"/><stop offset=".45" stop-color="#D6BAA8"/><stop offset="1" stop-color="#E3CBB9"/>

    <linearGradient id="gLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A88F"/><stop offset="1" stop-color="#A57F66"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B08A72"/><stop offset="1" stop-color="#8B6A54"/>
    </linearGradient>
    <linearGradient id="pTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C3170"/><stop offset="1" stop-color="#3A2356"/>
    </linearGradient>
    <linearGradient id="pLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2356"/><stop offset="1" stop-color="#2A1740"/>
    </linearGradient>
    <linearGradient id="pRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E1A46"/><stop offset="1" stop-color="#1F1130"/>
    </linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gSphere" cx=".33" cy=".28" r=".85">
      <stop offset="0" stop-color="#FBF1E8"/><stop offset=".42" stop-color="#D6BAA8"/><stop offset="1" stop-color="#9C7861"/>
    </radialGradient>
  </defs>
</svg>

<header class="site">

  // ---------- أدوات بناء العناصر ----------
  function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }
  function bi(e, o, k){                     // نص ثنائي اللغة
    var ar=(o&&o[k+'_ar'])||'', en=(o&&o[k+'_en'])||ar;
    e.setAttribute('data-ar',ar); e.setAttribute('data-en',en); e.innerHTML=ar; return e;
  }
  function setBi(id, o, k){ var e=document.getElementById(id); if(e) bi(e,o,k); }
  function fmtDate(d){
    if(!d) return {ar:'',en:''};
    var t=new Date(d); if(isNaN(t)) return {ar:d,en:d};
    var opt={year:'numeric',month:'long',day:'numeric'};
    var ar,en;
    try{ ar=t.toLocaleDateString('ar-SA-u-ca-gregory',opt); }catch(e){ ar=d; }
    try{ en=t.toLocaleDateString('en-GB',opt); }catch(e){ en=d; }
    return {ar:ar,en:en};
  }

  // ---------- رسم الموقع من المحتوى ----------
  function render(S, N){
    // الواجهة
    (function(){
      var im=document.getElementById('heroimg'), tl=document.getElementById('herotilt');
      var src=(S.hero&&S.hero.image)||'';
      var sh=document.querySelector('.hSheen');
      if(im&&tl){ if(src){ im.src=src; im.hidden=false; tl.hidden=true; if(sh) sh.style.display='none'; } else { im.hidden=true; tl.hidden=false; if(sh) sh.style.display=''; } }
    })();
    setBi('h-eyebrow',S.hero,'eyebrow'); setBi('h-title',S.hero,'title');
    setBi('h-lead',S.hero,'lead'); setBi('h-cta1',S.hero,'cta1'); setBi('h-cta2',S.hero,'cta2');
    var meta=document.getElementById('h-meta'); meta.innerHTML='';
    (S.hero.meta||[]).forEach(function(m){ meta.appendChild(bi(el('span'),m,'text')); });

    // الأرقام
    var sg=document.getElementById('statsgrid'); sg.innerHTML='';
    (S.stats||[]).forEach(function(s){
      var c=el('div','cell'); var n=el('div','n'); n.setAttribute('dir','ltr'); n.textContent=s.value||'';
      c.appendChild(n); c.appendChild(bi(el('div','t'),s,'label')); sg.appendChild(c);
    });

    // من نحن
    setBi('about-h',S.about,'heading'); setBi('about-quote',S.about,'quote');
    var ab=document.getElementById('about-body'); ab.innerHTML='';
    var par_ar=(S.about.body_ar||'').split(/\n\s*\n/), par_en=(S.about.body_en||'').split(/\n\s*\n/);
    par_ar.forEach(function(t,i){
      var p=el('p'); if(i) p.style.marginBlockStart='18px';
      p.setAttribute('data-ar',t); p.setAttribute('data-en',par_en[i]||t); p.innerHTML=t; ab.appendChild(p);
    });
    var vg=document.getElementById('valuesgrid'); vg.innerHTML='';
    (S.about.values||[]).forEach(function(v){
      var card=el('div','valcard tilt reveal');
      var ic=el('div','ico3d'); ic.innerHTML=ICONS[v.icon]||ICONS.VAL1; card.appendChild(ic);
      var box=el('div'); box.appendChild(bi(el('h3'),v,'title')); box.appendChild(bi(el('p'),v,'text'));
      card.appendChild(box); vg.appendChild(card);
    });

    // الخدمات
    setBi('svc-h',S.services,'heading'); setBi('svc-note',S.services,'note');
    var sv=document.getElementById('svcgrid'); sv.innerHTML='';
    var sel=document.getElementById('f-svc'); sel.innerHTML='';
    (S.services.items||[]).forEach(function(s){
      var a=el('article','svc-card tilt reveal');
      var ic=el('div','ico3d'); ic.innerHTML=ICONS[s.icon]||ICONS.SVC1; a.appendChild(ic);
      a.appendChild(bi(el('h3'),s,'title')); a.appendChild(bi(el('p'),s,'text')); sv.appendChild(a);
      sel.appendChild(bi(el('option'),s,'title'));
    });

    // المنهجية
    setBi('proc-h',S.process,'heading'); setBi('proc-note',S.process,'note');
    var st=document.getElementById('stepsgrid'); st.innerHTML='';
    (S.process.items||[]).forEach(function(p,i){
      var d=el('div','step reveal');
      var c=el('div','cube'); c.innerHTML=STEPS[i%4]; d.appendChild(c);
      d.appendChild(bi(el('h3'),p,'title')); d.appendChild(bi(el('p'),p,'text')); st.appendChild(d);
    });

    // لماذا بنون
    setBi('why-h',S.why,'heading');
    var wg=document.getElementById('whygrid'); wg.innerHTML='';
    (S.why.items||[]).forEach(function(w){
      var a=el('article','reveal');
      a.appendChild(bi(el('p','num'),w,'tag'));
      a.appendChild(bi(el('h3'),w,'title'));
      a.appendChild(bi(el('p'),w,'text')); wg.appendChild(a);
    });

    // الهيكل التنظيمي
    (function(){
      var sec=document.getElementById('org'); if(!sec) return;
      var D=S.org||{}, items=D.items||[];
      var show=(D.show!==false)&&items.length>0;
      sec.hidden=!show;
      var nv=document.getElementById('navorg'); if(nv) nv.hidden=!show;
      if(!show) return;
      setBi('org-h',D,'heading'); setBi('org-note',D,'note');
      var g=document.getElementById('orggrid'); g.innerHTML='';
      items.forEach(function(o){
        var a=el('article','reveal');
        if(o.tag_ar||o.tag_en) a.appendChild(bi(el('p','num'),o,'tag'));
        a.appendChild(bi(el('h3'),o,'title'));
        if(o.text_ar||o.text_en) a.appendChild(bi(el('p'),o,'text'));
        g.appendChild(a);
      });
    })();

    // فروعنا
    (function(){

        if(b.map){

    // الأخبار

    var showNews=(S.news&&S.news.show!==false)&&items.length>0;
    newsSec.hidden=!showNews; if(navnews) navnews.hidden=!showNews;
    if(showNews){
      setBi('news-h',S.news,'heading'); setBi('news-note',S.news,'note');
      items = items.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      var ng=document.getElementById('newsgrid'); ng.innerHTML='';
      items.forEach(function(it){
        var a=el('article','reveal');
        if(it.image){
          var th=el('div','thumb'); var im=el('img'); im.src=it.image; im.alt=it.title_ar||''; im.loading='lazy';
          th.appendChild(im); a.appendChild(th);

        a.appendChild(bi(el('h3'),it,'title'));

          det.appendChild(sm); det.appendChild(bi(el('div','body'),it,'body')); a.appendChild(det);
        }
        ng.appendChild(a);
      });
    }

    // شريط الدعوة
    setBi('cta-title',S.cta,'title'); setBi('cta-text',S.cta,'text'); setBi('cta-btn',S.cta,'button');

  // ---------- تحميل المحتوى ----------
  function seed(id){ try{ return JSON.parse(document.getElementById(id).textContent); }catch(e){ return null; } }
  function grab(url){
    if(!window.fetch) return Promise.resolve(null);
    return fetch(url,{cache:'no-cache'}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
  }
  var S0=seed('seed'), N0=seed('seed-news');
  Promise.all([grab('site.json'), grab('news.json')]).then(function(res){
    render(res[0]||S0, res[1]||N0);
    boot();
  });

  // ---------- تشغيل الواجهة بعد الرسم ----------
  var current='ar';
  function apply(lang){
    var root=document.documentElement;
    root.setAttribute('lang', lang);
    root.setAttribute('dir', lang==='ar'?'rtl':'ltr');
    var nodes=document.querySelectorAll('[data-ar]');
    for(var i=0;i<nodes.length;i++){
      var v=nodes[i].getAttribute('data-'+lang);
      if(v!==null) nodes[i].innerHTML=v;
    }
    try{localStorage.setItem('banon-lang',lang);}catch(e){}
  }

        + '</linearGradient></defs><g fill="url(#b)">'
        + '<path d="M8 2l6 6-6 6-6-6z"/><path d="M24 5l3 3-3 3-3-3z" opacity=".45"/>'
        + '<path d="M40 2l6 6-6 6-6-6z"/><path d="M56 5l3 3-3 3-3-3z" opacity=".45"/>'
        + '</g></svg>';
    var band=document.getElementById('band');
    if(band){band.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(s)+'")';}

    try{var saved=localStorage.getItem('banon-lang'); if(saved==='en'||saved==='ar') current=saved;}catch(e){}
    apply(current);
    document.getElementById('langbtn').addEventListener('click',function(){
      current=(current==='ar')?'en':'ar'; apply(current);
    });

    // قائمة الجوال
    var nav=document.getElementById('nav'), mb=document.getElementById('menubtn');
    mb.addEventListener('click',function(){
      var open=nav.classList.toggle('open');
      mb.setAttribute('aria-expanded',open?'true':'false');
    });
    nav.addEventListener('click',function(e){
      if(e.target.tagName==='A'){nav.classList.remove('open');mb.setAttribute('aria-expanded','false');}
    });

    // نموذج التواصل -> بريد
    document.getElementById('cform').addEventListener('submit',function(e){
      e.preventDefault();
      var f=e.target, ar=(current==='ar');
      var subject=(ar?'طلب استشارة — ':'Consultation request — ')+f.service.value;
      var body=(ar?'الاسم: ':'Name: ')+f.name.value+'\n'
              +(ar?'الجهة: ':'Organisation: ')+f.org.value+'\n'
              +(ar?'البريد: ':'Email: ')+f.email.value+'\n'
              +(ar?'الخدمة: ':'Service: ')+f.service.value+'\n\n'
              +f.message.value;
      var key=window.__banonFormKey||'';
      var st=document.getElementById('fstatus');
      var btn=f.querySelector('button[type="submit"]');
      function say(msg,ok){ if(!st) return; st.textContent=msg; st.className='fstatus '+(ok?'ok':'err'); }
      if(!key){
        window.location.href='mailto:'+(window.__banonEmail||'info@banon.sa')
          +'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
        return;
      }
      if(f.website && f.website.value){ return; }
      if(btn){ btn.disabled=true; btn.dataset.t=btn.textContent; btn.textContent=(ar?'جارٍ الإرسال…':'Sending…'); }
      say(ar?'جارٍ الإرسال…':'Sending…',true);
      fetch('https://api.web3forms.com/submit',{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({
          access_key:key, subject:subject, from_name:'موقع بنون',
          'الاسم':f.name.value, 'الجهة':f.org.value, 'البريد':f.email.value,
          'الخدمة':f.service.value, 'الرسالة':f.message.value, replyto:f.email.value
        })
      }).then(function(r){return r.json();}).then(function(d){
        if(d&&d.success){
          f.reset();
          say(ar?'وصلنا طلبك، وسنتواصل معك قريبًا.':'Your request has been received. We will contact you shortly.',true);
        }else{
          say(ar?'تعذّر الإرسال. حاول مرة أخرى أو راسلنا على البريد مباشرة.':'Could not send. Please try again or email us directly.',false);
        }
      }).catch(function(){
        say(ar?'تعذّر الإرسال. تأكد من اتصالك بالإنترنت.':'Could not send. Check your connection.',false);
      }).then(function(){
        if(btn){ btn.disabled=false; btn.textContent=btn.dataset.t||(ar?'إرسال الطلب':'Send request'); }
      });
    });

    // تمرير سلس
    document.addEventListener('click',function(e){
      var a=e.target.closest? e.target.closest('a[href^="#"]') : null;
      if(!a) return;
      var el2=document.querySelector(a.getAttribute('href'));
      if(!el2) return;
      e.preventDefault();
      var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el2.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
    });

    // ظهور العناصر عند التمرير
    var reveals=document.querySelectorAll('.reveal');
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(entries){
        entries.forEach(function(en,i){
          if(en.isIntersecting){
            var t=en.target;
            setTimeout(function(){t.classList.add('in');}, Math.min(i*70,280));
            io.unobserve(t);
          }
        });
      },{rootMargin:'0px 0px -8% 0px',threshold:.12});
      for(var r=0;r<reveals.length;r++) io.observe(reveals[r]);
    } else {
      for(var r2=0;r2<reveals.length;r2++) reveals[r2].classList.add('in');
    }

    // ميلان ثلاثي الأبعاد مع الفأرة
    var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var hoverOK=window.matchMedia('(hover:hover)').matches;
    var art=document.getElementById('heroart'), tilt=document.getElementById('herotilt');
    if(art && tilt && !reduceMotion && hoverOK){
      art.addEventListener('mousemove',function(e){
        var b=art.getBoundingClientRect();
        var x=(e.clientX-b.left)/b.width-.5, y=(e.clientY-b.top)/b.height-.5;
        tilt.style.transform='rotateX('+(-y*12)+'deg) rotateY('+(x*14)+'deg) translateZ(14px)';
      });
      art.addEventListener('mouseleave',function(){tilt.style.transform='';});
    }
    if(!reduceMotion && hoverOK){
      var cards=document.querySelectorAll('.svc-card.tilt,.valcard.tilt');
      for(var c=0;c<cards.length;c++){
        (function(card){
          card.addEventListener('mousemove',function(e){
            var b=card.getBoundingClientRect();
            var x=(e.clientX-b.left)/b.width-.5, y=(e.clientY-b.top)/b.height-.5;
            card.style.transform='translateY(-8px) rotateX('+(-y*7)+'deg) rotateY('+(x*9)+'deg)';
          });
          card.addEventListener('mouseleave',function(){card.style.transform='';});
        })(cards[c]);
      }
    }
  }
})();
</script>

</body>
</html>
